<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WorkDesk</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="assets/images/workdesk/workdesk-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <!-- <script src="https://kit.fontawesome.com/8ca4c4f7c7.js" crossorigin="anonymous"></script> -->
  <script>
    // apply saved light/dark mode before first paint (see ThemeService)
    // login / signup / password pages always stay light (see LIGHT_ONLY_PAGES)
    try { var p = (location.pathname.replace(/\/+$/, '') || '/').toLowerCase();
      var lightOnly = ['/', '/login', '/signup', '/forgot', '/reset-password'].indexOf(p) > -1;
      var t = !lightOnly && localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.setAttribute('data-bs-theme', t); } catch (e) { }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
